<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b63e6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ズボ管">
  <meta name="description" content="大学の課題の出し忘れを減らす課題管理アプリ">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>ズボ管｜課題の出し忘れ0</title>
</head>
<body>
  <header class="topbar">
    <div><div class="brand">ズボ管 <span>課題の出し忘れ0</span></div><p id="todayLine" class="muted"></p></div>
    <button id="notifyBtn" class="secondary small">通知設定</button>
  </header>
  <main>
    <section class="hero">
      <div><p class="eyebrow">YOUR TASKS</p><h1>課題を、<br>忘れる前に。</h1><p class="muted">登録して、終わったらチェック。</p></div>
      <div class="hero-count"><strong id="remainingCount">0</strong><span>未完了</span></div>
    </section>
    <section class="stats">
      <div><span>今日が期限</span><strong id="todayCount">0</strong></div>
      <div><span>期限切れ</span><strong id="overdueCount">0</strong></div>
      <div><span>完了</span><strong id="doneCount">0</strong></div>
    </section>
    <section class="panel">
      <div class="section-head"><h2 id="formTitle">課題を追加</h2><span class="required">* 必須</span></div>
      <form id="taskForm">
        <label>授業名・科目名 *<input id="course" maxlength="60" placeholder="例：都市計画論" required></label>
        <label>課題の内容 *<input id="taskTitle" maxlength="100" placeholder="例：第4回レポート" required></label>
        <label>提出期限 *<input id="due" type="datetime-local" required></label>
        <label>リマインド設定<select id="reminders"><option value="1440,60">前日・1時間前</option><option value="4320,1440,60">3日前・前日・1時間前</option><option value="1440">前日</option><option value="180,30">3時間前・30分前</option><option value="0">期限時刻のみ</option></select></label>
        <label>科目カラー</label><div id="colors" class="colors" aria-label="科目カラーを選択"></div>
        <div class="form-actions"><button type="submit" class="primary" id="saveBtn">課題を追加</button><button type="button" class="secondary hidden" id="cancelEdit">編集をやめる</button></div>
      </form>
    </section>
    <section class="tasks-section">
      <div class="section-head"><h2>課題一覧</h2><span class="muted" id="taskTotal">0件</span></div>
      <div class="filters"><button class="filter active" data-filter="active">未完了</button><button class="filter" data-filter="today">今日が期限</button><button class="filter" data-filter="overdue">期限切れ</button><button class="filter" data-filter="done">完了済み</button><button class="filter" data-filter="all">すべて</button></div>
      <div id="taskList" class="task-list"></div>
      <div id="emptyState" class="empty"><div class="empty-icon">✓</div><strong>課題はまだありません</strong><p>上のフォームから課題を登録しましょう。</p></div>
    </section>
    <section class="note"><strong>通知について</strong><p id="notifyStatus">この試作版は、アプリを開いている間の期限チェックに対応しています。アプリ終了中の通知には、公開後にプッシュ通知サーバーの設定が必要です。</p></section>
    <footer>ズボ管 · データはこのiPhoneのブラウザ内に保存されます。</footer>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
